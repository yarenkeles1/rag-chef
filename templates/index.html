<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rag-Chef</title>

    <style>
        :root {
            --bg: #0f172a;            /* dark navy */
            --panel: #111827;        /* darker card */
            --primary: #f59e0b;      /* amber chef vibe */
            --secondary: #22c55e;    /* fresh green */
            --text: #e5e7eb;
            --muted: #9ca3af;

            --user: #f59e0b;
            --bot: #1f2937;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1e293b, var(--bg));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            height: 90vh;
            background: var(--panel);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chat-header {
            padding: 18px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #0b1220;
            letter-spacing: 0.5px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.25s ease;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background: var(--user);
            color: #111;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--bot);
            color: var(--text);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .input-area {
            display: flex;
            padding: 14px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        #user-input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #0b1220;
            color: var(--text);
            outline: none;
        }

        #user-input:focus {
            border-color: var(--primary);
        }

        #send-btn {
            margin-left: 10px;
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: var(--primary);
            color: #111;
            font-weight: 600;
            transition: 0.2s;
        }

        #send-btn:hover {
            transform: scale(1.05);
        }

        .loading {
            display: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        👨‍🍳 Rag-Chef
    </div>

    <div class="chat-box" id="chat-box">
        <div class="message bot-message">
            Welcome! I’m <b>Rag-Chef</b> 🍳<br>
            Ask me any recipe or tell me your ingredients.
        </div>
    </div>

    <div class="loading" id="loading">
        Cooking your answer...
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask for a recipe..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const loading = document.getElementById('loading');
    const sendBtn = document.getElementById('send-btn');

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function addMessage(text, isUser) {
        const div = document.createElement('div');
        div.classList.add('message', isUser ? 'user-message' : 'bot-message');
        div.innerHTML = text.replace(/\n/g, "<br>");
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, true);
        userInput.value = '';

        loading.style.display = 'block';
        userInput.disabled = true;
        sendBtn.disabled = true;

        try {
            const res = await fetch('/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ question: text })
            });

            const data = await res.json();

            if (res.ok) {
                addMessage(data.answer, false);
            } else {
                addMessage("Error: " + (data.error || "Something went wrong"), false);
            }

        } catch (err) {
            addMessage("Server connection error.", false);
        }

        loading.style.display = 'none';
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }
</script>

</body>
</html>
